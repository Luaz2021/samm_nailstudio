<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Anatómico 3D de Uñas · samm. NAIL STUDIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #14100E;
      color: #FAF8F5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .studio-wrapper {
      width: 100%;
      max-width: 1060px;
      height: 100%;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      align-items: stretch;
    }

    @media (max-width: 820px) {
      body {
        height: auto;
        overflow-y: auto;
      }
      .studio-wrapper {
        grid-template-columns: 1fr;
        height: auto;
        padding: 12px;
        gap: 14px;
      }
      .hand-canvas-area {
        min-height: 250px;
      }
      .editorial-hand-svg {
        height: 270px;
      }
    }

    /* ==========================================
       COLUMNA IZQUIERDA: VISOR ANATÓMICO 3D
       ========================================== */
    .stage-box {
      background: radial-gradient(circle at 50% 25%, #2B211D 0%, #191412 65%, #120E0D 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 45px rgba(0, 0, 0, 0.5);
    }

    /* Luz ambiental reactiva al color de esmalte */
    .ambient-glow {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 220px;
      background: #EAD8CE;
      filter: blur(85px);
      opacity: 0.16;
      pointer-events: none;
      transition: background 0.5s ease;
    }

    .stage-top-bar {
      padding: 16px 20px 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge-outline {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #C8927B;
      background: rgba(200, 146, 123, 0.1);
      border: 1px solid rgba(200, 146, 123, 0.3);
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
    }

    .badge-spec {
      font-size: 11px;
      color: #FAF8F5;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 14px;
      border-radius: 999px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EAD8CE;
      border: 1px solid rgba(255,255,255,0.5);
      display: inline-block;
    }

    /* Lienzo SVG de la Mano Editorial */
    .hand-canvas-area {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      min-height: 360px;
      overflow: hidden;
    }

    .editorial-hand-svg {
      width: 100%;
      max-width: 470px;
      height: 390px;
      display: block;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.65));
    }

    .nail-interactive {
      cursor: pointer;
      transition: filter 0.25s ease;
    }
    .nail-interactive:hover {
      filter: brightness(1.08);
    }

    /* Barra Inferior del Visor: Selector de Tono de Piel */
    .stage-bottom-bar {
      padding: 12px 20px;
      background: rgba(18, 14, 13, 0.85);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }

    .skin-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .skin-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #A89C96;
      font-weight: 600;
      margin-right: 2px;
    }

    .skin-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .skin-dot:hover {
      transform: scale(1.12);
    }

    .skin-dot.active {
      border-color: #FAF8F5;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
    }

    .sterile-tag {
      font-size: 11px;
      color: #C8927B;
      font-weight: 600;
    }

    /* ==========================================
       COLUMNA DERECHA: ACORDEÓN INTERACTIVO
       ========================================== */
    .accordion-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      height: 100%;
    }

    .acc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .acc-card {
      background: #1C1715;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .acc-card.open {
      background: #231C19;
      border-color: rgba(200, 146, 123, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .acc-trigger {
      width: 100%;
      padding: 13px 16px;
      background: transparent;
      border: none;
      color: #FAF8F5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      text-align: left;
    }

    .acc-trigger:hover .acc-step-title {
      color: #EAD8CE;
    }

    .acc-step-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #C8927B;
      font-weight: 700;
      transition: color 0.2s;
    }

    .acc-current-val {
      font-size: 11px;
      color: #FAF8F5;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .acc-arrow {
      width: 14px;
      height: 14px;
      stroke: #A89C96;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .acc-card.open .acc-arrow {
      transform: rotate(180deg);
      stroke: #C8927B;
    }

    .acc-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.32s cubic-bezier(0.4, 0, 0.2, 1), padding 0.32s ease;
      padding: 0 16px;
    }

    .acc-card.open .acc-body {
      max-height: 210px;
      padding: 2px 16px 15px 16px;
    }

    /* 1. Swatches de Color */
    .swatches-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
    }

    .color-btn {
      height: 44px;
      border-radius: 11px;
      border: 2px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      position: relative;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      overflow: hidden;
    }

    .color-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, transparent 50%);
      pointer-events: none;
    }

    .color-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .color-btn.active {
      border-color: #FAF8F5;
      transform: scale(1.05);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
    }

    /* 2. Botones de Forma con Icono SVG */
    .options-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .options-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .opt-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 6px;
      color: #D2C5BE;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .opt-pill:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #FAF8F5;
    }

    .opt-pill.active {
      background: #C8927B;
      color: #161210;
      font-weight: 700;
      border-color: #C8927B;
      box-shadow: 0 4px 12px rgba(200, 146, 123, 0.3);
    }

    /* 4. Diseños Nail Art Armados */
    .designs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .design-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 11px;
      padding: 9px 10px;
      cursor: pointer;
      text-align: left;
      color: #FAF8F5;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .design-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .design-btn.active {
      background: #FAF8F5;
      color: #181412;
      border-color: #FAF8F5;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
    }

    .design-name {
      font-size: 11px;
      font-weight: 700;
      display: block;
    }

    .design-sub {
      font-size: 9px;
      color: #A89C96;
      display: block;
    }

    .design-btn.active .design-sub {
      color: #5A4D46;
    }

    /* Botón CTA Agendar */
    .cta-book-btn {
      background: linear-gradient(135deg, #FAF8F5 0%, #E7D8C9 100%);
      color: #181412;
      border: none;
      border-radius: 16px;
      padding: 15px 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      width: 100%;
    }

    .cta-book-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>

  <div class="studio-wrapper">
    
    <!-- ==========================================
         COLUMNA IZQUIERDA: VISOR ANATÓMICO 3D
         ========================================== -->
    <div class="stage-box">
      <div class="ambient-glow" id="ambientGlow"></div>

      <!-- Barra Superior -->
      <div class="stage-top-bar">
        <span class="badge-outline">VISTA MACRO EN CABINA</span>
        <div class="badge-spec">
          <span class="spec-dot" id="specColorDot"></span>
          <span id="liveSummaryText">Berry Glaze · Almendra · Glazed Cromo</span>
        </div>
      </div>

      <!-- Mano Editorial en Primer Plano con Uñas 3D Ancladas al Dedo -->
      <div class="hand-canvas-area">
        <svg class="editorial-hand-svg" viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Sombra suave para la uña sobre el lecho ungueal -->
            <filter id="nailBedShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1A0D08" flood-opacity="0.45" />
            </filter>

            <!-- Difuminado suave para efecto Aura y Rubor de Nudillos -->
            <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="5.5" />
            </filter>

            <filter id="LunulaBlur" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="1.2" />
            </filter>

            <!-- Gradiente Cilíndrico 3D de la Piel (Se actualiza con el selector de piel) -->
            <linearGradient id="skinCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" id="skinStop1" stop-color="#C59B82" />
              <stop offset="22%" id="skinStop2" stop-color="#DFB9A2" />
              <stop offset="52%" id="skinStop3" stop-color="#ECCBB6" />
              <stop offset="82%" id="skinStop4" stop-color="#DBAFA0" />
              <stop offset="100%" id="skinStop5" stop-color="#B88B73" />
            </linearGradient>

            <!-- Rubor Cálido Anatómico en Articulaciones -->
            <radialGradient id="knuckleBlush" cx="50%" cy="50%" r="50%">
              <stop offset="0%" id="blushStop1" stop-color="#C97A6A" stop-opacity="0.28" />
              <stop offset="100%" id="blushStop2" stop-color="#C97A6A" stop-opacity="0" />
            </radialGradient>

            <!-- Volumen Cilíndrico 3D para dar curvatura real a cada uña -->
            <linearGradient id="nail3DVolume" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0.32" />
              <stop offset="18%" stop-color="#000000" stop-opacity="0.06" />
              <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.16" />
              <stop offset="68%" stop-color="#000000" stop-opacity="0.03" />
              <stop offset="88%" stop-color="#FFFFFF" stop-opacity="0.10" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
            </linearGradient>

            <!-- Efecto Glazed Donut Pearl (Hailey Bieber) -->
            <linearGradient id="glazedPearlSheen" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52" />
              <stop offset="35%" stop-color="#FFDCE8" stop-opacity="0.25" />
              <stop offset="65%" stop-color="#E6F0FF" stop-opacity="0.18" />
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45" />
            </linearGradient>

            <!-- Efecto Ojo de Gato Magnético (Cat Eye Velvet) -->
            <linearGradient id="catEyeBeam" x1="0%" y1="20%" x2="100%" y2="80%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0.35" />
              <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.05" />
              <stop offset="50%" stop-color="#FFF6E8" stop-opacity="0.65" />
              <stop offset="62%" stop-color="#FFFFFF" stop-opacity="0.05" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
            </linearGradient>

            <!-- Oro 18K para Anillos de Estudio -->
            <linearGradient id="gold18k" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#9C7A3C" />
              <stop offset="30%" stop-color="#F5E1A4" />
              <stop offset="50%" stop-color="#D4AF37" />
              <stop offset="75%" stop-color="#FFF2C2" />
              <stop offset="100%" stop-color="#8A692D" />
            </linearGradient>

            <!-- ClipPath Dinámico de la Forma de la Uña (Se actualiza vía JS para las 4 uñas) -->
            <clipPath id="nailShapeClip">
              <path id="masterClipPath" d="M -22,-2 C -22,-32 -13,-68 0,-70 C 13,-68 22,-32 22,-2 C 22,16 13,24 0,24 C -13,24 -22,16 -22,-2 Z" />
            </clipPath>
          </defs>

          <!-- ========================================================
               LOS 4 DEDOS ANATÓMICOS EN POSE EDITORIAL DE MANICURA
               Cada dedo comparte el mismo sistema local (0,0 = centro de uña)
               para que la uña jamás se desfase ni flote en el aire.
               ======================================================== -->
          <g id="fingersStage"></g>

        </svg>
      </div>

      <!-- Barra Inferior: Selector de Tono de Piel -->
      <div class="stage-bottom-bar">
        <div class="skin-selector">
          <span class="skin-label">Tono de piel:</span>
          <button class="skin-dot" style="background: #F3D9C8;" onclick="setSkinTone(0, this)" title="Porcelana"></button>
          <button class="skin-dot active" style="background: #E2B89E;" onclick="setSkinTone(1, this)" title="Trigueña Clara"></button>
          <button class="skin-dot" style="background: #C6906E;" onclick="setSkinTone(2, this)" title="Miel Dorada"></button>
          <button class="skin-dot" style="background: #8D5B40;" onclick="setSkinTone(3, this)" title="Canela Intensa"></button>
        </div>
        <span class="sterile-tag">Cutícula Rusa · Alta Precisión</span>
      </div>
    </div>

    <!-- ==========================================
         COLUMNA DERECHA: ACORDEÓN DESPLEGABLE
         ========================================== -->
    <div class="accordion-column">
      <div class="acc-list">

        <!-- 1. PALETA DE TONOS -->
        <div class="acc-card open" id="card-color">
          <button class="acc-trigger" onclick="openAccordion('card-color')">
            <span class="acc-step-title">1. Paleta de Tonos</span>
            <span class="acc-current-val">
              <span id="val-color">Berry Glaze</span>
              <svg class="acc-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </button>
          <div class="acc-body">
            <div class="swatches-grid">
              <button class="color-btn" style="background: #EAD8CE;" data-color="#EAD8CE" data-name="Milky Almond"></button>
              <button class="color-btn" style="background: #D9A094;" data-color="#D9A094" data-name="Blush Nude"></button>
              <button class="color-btn active" style="background: #84323E;" data-color="#84323E" data-name="Berry Glaze"></button>
              <button class="color-btn" style="background: #231D1B;" data-color="#231D1B" data-name="Espresso Dark"></button>
              <button class="color-btn" style="background: #EFECE8;" data-color="#EFECE8" data-name="Glazed Pearl"></button>
              <button class="color-btn" style="background: #A36655;" data-color="#A36655" data-name="Rosewood"></button>
              <button class="color-btn" style="background: #B8292F;" data-color="#B8292F" data-name="Rouge Couture"></button>
              <button class="color-btn" style="background: #3B4B3F;" data-color="#3B4B3F" data-name="Olive Atelier"></button>
              <button class="color-btn" style="background: #F4E8D7;" data-color="#F4E8D7" data-name="Butter Cream"></button>
              <button class="color-btn" style="background: #B79883;" data-color="#B79883" data-name="Warm Taupe"></button>
            </div>
          </div>
        </div>

        <!-- 2. FORMA ESTRUCTURAL -->
        <div class="acc-card" id="card-shape">
          <button class="acc-trigger" onclick="openAccordion('card-shape')">
            <span class="acc-step-title">2. Forma Estructural</span>
            <span class="acc-current-val">
              <span id="val-shape">Almendra</span>
              <svg class="acc-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </button>
          <div class="acc-body">
            <div class="options-grid-4">
              <button class="opt-pill active" onclick="setNailShape('almendra', 'Almendra', this)">
                <svg width="16" height="24" viewBox="0 0 20 30" fill="currentColor"><path d="M3 22 C3 10, 7 2, 10 2 C13 2, 17 10, 17 22 C17 26, 14 28, 10 28 C6 28, 3 26, 3 22 Z"/></svg>
                <span>Almendra</span>
              </button>
              <button class="opt-pill" onclick="setNailShape('coffin', 'Coffin', this)">
                <svg width="16" height="24" viewBox="0 0 20 30" fill="currentColor"><path d="M3 22 L6 3 L14 3 L17 22 C17 26, 14 28, 10 28 C6 28, 3 26, 3 22 Z"/></svg>
                <span>Coffin</span>
              </button>
              <button class="opt-pill" onclick="setNailShape('cuadrada', 'Cuadrada', this)">
                <svg width="16" height="24" viewBox="0 0 20 30" fill="currentColor"><path d="M3 22 L3 5 C3 3, 5 3, 10 3 C15 3, 17 3, 17 5 L17 22 C17 26, 14 28, 10 28 C6 28, 3 26, 3 22 Z"/></svg>
                <span>Cuadrada</span>
              </button>
              <button class="opt-pill" onclick="setNailShape('oval', 'Ovalada', this)">
                <svg width="16" height="24" viewBox="0 0 20 30" fill="currentColor"><path d="M3 22 C3 8, 6 4, 10 4 C14 4, 17 8, 17 22 C17 26, 14 28, 10 28 C6 28, 3 26, 3 22 Z"/></svg>
                <span>Ovalada</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 3. ACABADO FINAL -->
        <div class="acc-card" id="card-finish">
          <button class="acc-trigger" onclick="openAccordion('card-finish')">
            <span class="acc-step-title">3. Acabado Final</span>
            <span class="acc-current-val">
              <span id="val-finish">Glazed Cromo</span>
              <svg class="acc-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </button>
          <div class="acc-body">
            <div class="options-grid-3">
              <button class="opt-pill active" onclick="setNailFinish('glazed', 'Glazed Cromo', this)">
                <span>Glazed Cromo</span>
              </button>
              <button class="opt-pill" onclick="setNailFinish('glossy', 'Glossy Espejo', this)">
                <span>Glossy Espejo</span>
              </button>
              <button class="opt-pill" onclick="setNailFinish('matte', 'Velvet Mate', this)">
                <span>Velvet Mate</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 4. DISEÑOS ARMADOS (NAIL ART) -->
        <div class="acc-card" id="card-design">
          <button class="acc-trigger" onclick="openAccordion('card-design')">
            <span class="acc-step-title">4. Diseños Armados</span>
            <span class="acc-current-val">
              <span id="val-design">Liso Puro</span>
              <svg class="acc-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </button>
          <div class="acc-body">
            <div class="designs-grid">
              <button class="design-btn active" onclick="setNailDesign('none', 'Liso Puro', this)">
                <span class="design-name">Liso Puro</span>
                <span class="design-sub">Monocromo limpio</span>
              </button>
              <button class="design-btn" onclick="setNailDesign('french', 'French Micro', this)">
                <span class="design-name">French Micro</span>
                <span class="design-sub">Sonrisa blanca fina</span>
              </button>
              <button class="design-btn" onclick="setNailDesign('aura', 'Aura Glow', this)">
                <span class="design-name">Aura Glow</span>
                <span class="design-sub">Difuminado central</span>
              </button>
              <button class="design-btn" onclick="setNailDesign('gold', 'Oro 24K', this)">
                <span class="design-name">Pan de Oro 24K</span>
                <span class="design-sub">Hojuelas doradas</span>
              </button>
              <button class="design-btn" onclick="setNailDesign('cateye', 'Cat Eye Velvet', this)">
                <span class="design-name">Cat Eye Velvet</span>
                <span class="design-sub">Destello magnético</span>
              </button>
              <button class="design-btn" onclick="setNailDesign('tortoise', 'Carey Ámbar', this)">
                <span class="design-name">Carey Ámbar</span>
                <span class="design-sub">Efecto tortoiseshell</span>
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- CTA Agendar -->
      <button class="cta-book-btn" onclick="triggerParentBooking()">
        <span>AGENDAR ESTE SET EN SAMM</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

  </div>

  <script>
    // Estado actual del simulador
    let state = {
      color: "#84323E",
      colorName: "Berry Glaze",
      shape: "almendra",
      shapeName: "Almendra",
      finish: "glazed",
      finishName: "Glazed Cromo",
      design: "none",
      designName: "Liso Puro"
    };

    // Paletas de Tono de Piel (Cilindro 3D realista)
    const SKIN_PALETTES = [
      // 0: Porcelana
      { s1: "#D6B4A1", s2: "#EDD0C0", s3: "#F8E2D4", s4: "#E8C7B5", s5: "#C69F89", blush: "#D97F73", crease: "#B3836D" },
      // 1: Trigueña Clara (Default)
      { s1: "#C59B82", s2: "#DFB9A2", s3: "#ECCBB6", s4: "#DBAFA0", s5: "#B88B73", blush: "#C97A6A", crease: "#9E6D56" },
      // 2: Miel Dorada
      { s1: "#A37458", s2: "#C29273", s3: "#D1A384", s4: "#BA896B", s5: "#8E5F43", blush: "#A85644", crease: "#784930" },
      // 3: Canela Intensa
      { s1: "#6B4430", s2: "#875941", s3: "#99684E", s4: "#80523B", s5: "#593624", blush: "#733326", crease: "#472718" }
    ];
    let currentCreaseColor = SKIN_PALETTES[1].crease;

    // Geometría de las 4 Formas Estructurales de la Uña (Ancladas en la cutícula y=24)
    const NAIL_SHAPES = {
      almendra: "M -21,-2 C -21,-32 -12,-68 0,-70 C 12,-68 21,-32 21,-2 C 21,16 13,24 0,24 C -13,24 -21,16 -21,-2 Z",
      coffin:   "M -21,-2 C -21,-20 -15,-48 -10,-65 C -9,-68 -6,-69 0,-69 C 6,-69 9,-68 10,-65 C 15,-48 21,-20 21,-2 C 21,16 13,24 0,24 C -13,24 -21,16 -21,-2 Z",
      cuadrada: "M -21,-2 L -20,-52 C -20,-61 -14,-63 0,-63 C 14,-63 20,-61 20,-52 L 21,-2 C 21,16 13,24 0,24 C -13,24 -21,16 -21,-2 Z",
      oval:     "M -21,-2 C -21,-38 -15,-63 0,-63 C 15,-63 21,-38 21,-2 C 21,16 13,24 0,24 C -13,24 -21,16 -21,-2 Z"
    };

    // Configuración anatómica de los 4 dedos en pose editorial (Índice, Medio, Anular, Meñique)
    const FINGERS_CONFIG = [
      { id: "index",  x: 112, y: 148, angle: 4.5,  scaleX: 0.95, scaleY: 0.96, ring: "midi" },
      { id: "middle", x: 205, y: 112, angle: 1.2,  scaleX: 1.03, scaleY: 1.04, ring: "none" },
      { id: "ring",   x: 298, y: 138, angle: -2.5, scaleX: 0.96, scaleY: 0.98, ring: "diamond" },
      { id: "pinky",  x: 384, y: 196, angle: -6.5, scaleX: 0.82, scaleY: 0.85, ring: "none" }
    ];

    // Construir el árbol SVG de los 4 dedos + uñas ancladas
    function buildHandScene() {
      const stage = document.getElementById("fingersStage");
      stage.innerHTML = "";

      // Actualizar el clipPath maestro según la forma elegida
      document.getElementById("masterClipPath").setAttribute("d", NAIL_SHAPES[state.shape]);

      FINGERS_CONFIG.forEach((f) => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `translate(${f.x}, ${f.y}) rotate(${f.angle}) scale(${f.scaleX}, ${f.scaleY})`);

        // 1. Cuerpo Anatómico del Dedo (Con contorno natural de falanges y yema redondeada)
        const fingerPath = `
          M -28,10
          C -28,-16 -16,-26 0,-26
          C 16,-26 28,-16 28,10
          C 28,32 30,52 30,68
          C 30,85 28.5,105 29,125
          C 29.5,148 31.5,168 31.5,190
          L 33,340
          L -33,340
          L -31.5,190
          C -31.5,168 -29.5,148 -29,125
          C -28.5,105 -30,85 -30,68
          C -30,52 -28,32 -28,10 Z
        `;

        // Renderizar Dedo + Rubor de articulación + Pliegues de nudillos + Joyería + Uña Clipped
        g.innerHTML = `
          <!-- Falange con sombreado cilíndrico 3D -->
          <path d="${fingerPath}" fill="url(#skinCylinder)" />

          <!-- Rubor cálido natural sobre las articulaciones -->
          <ellipse cx="0" cy="65" rx="26" ry="18" fill="url(#knuckleBlush)" filter="url(#softBlur)" />
          <ellipse cx="0" cy="175" rx="28" ry="22" fill="url(#knuckleBlush)" filter="url(#softBlur)" />

          <!-- Pliegues anatómicos sutiles del nudillo superior (DIP) -->
          <path d="M -18,62 Q 0,66 18,62" stroke="${currentCreaseColor}" stroke-width="1.1" fill="none" opacity="0.45" stroke-linecap="round" />
          <path d="M -14,67 Q 0,70 14,67" stroke="${currentCreaseColor}" stroke-width="0.9" fill="none" opacity="0.3" stroke-linecap="round" />

          <!-- Pliegues anatómicos del nudillo medio (PIP) -->
          <path d="M -21,168 Q 0,173 21,168" stroke="${currentCreaseColor}" stroke-width="1.3" fill="none" opacity="0.5" stroke-linecap="round" />
          <path d="M -19,175 Q 0,179 19,175" stroke="${currentCreaseColor}" stroke-width="1.1" fill="none" opacity="0.38" stroke-linecap="round" />
          <path d="M -13,181 Q 0,184 13,181" stroke="${currentCreaseColor}" stroke-width="0.8" fill="none" opacity="0.25" stroke-linecap="round" />

          <!-- Joyería Editorial de Estudio (Anillos de Oro 18K) -->
          ${f.ring === "midi" ? `
            <path d="M -29.2,108 Q 0,115 29.2,108" stroke="url(#gold18k)" stroke-width="3.2" fill="none" stroke-linecap="round" />
            <path d="M -29.2,108 Q 0,115 29.2,108" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.6" />
          ` : ""}
          ${f.ring === "diamond" ? `
            <path d="M -31.5,212 Q 0,220 31.5,212" stroke="url(#gold18k)" stroke-width="3.8" fill="none" stroke-linecap="round" />
            <circle cx="0" cy="215" r="4.5" fill="url(#gold18k)" />
            <circle cx="0" cy="215" r="3.2" fill="#FFFFFF" />
          ` : ""}

          <!-- Bolsillo de Cutícula Rusa (Sombra anatómica en U donde nace la uña) -->
          <path d="M -22.5,-1 C -22.5,18 -13.5,25.5 0,25.5 C 13.5,25.5 22.5,18 22.5,-1" fill="none" stroke="${currentCreaseColor}" stroke-width="2.2" opacity="0.65" />
          <path d="M -23,2 C -23,19.5 -14,27 0,27 C 14,27 23,19.5 23,2" fill="none" stroke="#FFF5EE" stroke-width="1.2" opacity="0.35" />

          <!-- ====================================================
               PLACA UNGUEAL INTERACTIVA (100% ANCLADA AL DEDO)
               ==================================================== -->
          <g class="nail-interactive" filter="url(#nailBedShadow)">
            <g clip-path="url(#nailShapeClip)">
              
              <!-- 1. Color Base del Esmalte -->
              <rect x="-26" y="-76" width="52" height="106" fill="${state.color}" />

              <!-- 2. Lúnula Natural (Media luna sutil en la base) -->
              <ellipse cx="0" cy="21" rx="13" ry="7.5" fill="#FFFFFF" opacity="0.13" filter="url(#LunulaBlur)" />

              <!-- 3. Capa de Diseño Nail Art Armado -->
              ${getDesignMarkup()}

              <!-- 4. Volumen Cilíndrico 3D de la Estructura de Gel/Acrílico -->
              <rect x="-26" y="-76" width="52" height="106" fill="url(#nail3DVolume)" />

              <!-- 5. Acabado Superficial (Glazed Cromo / Glossy Espejo / Velvet Mate) -->
              ${getFinishMarkup()}

            </g>
          </g>
        `;

        stage.appendChild(g);
      });

      // Actualizar textos y luces
      document.getElementById("val-color").textContent = state.colorName;
      document.getElementById("val-shape").textContent = state.shapeName;
      document.getElementById("val-finish").textContent = state.finishName;
      document.getElementById("val-design").textContent = state.designName;

      const designPart = state.design !== "none" ? ` · ${state.designName}` : "";
      document.getElementById("liveSummaryText").textContent = `${state.colorName} · ${state.shapeName} · ${state.finishName}${designPart}`;
      document.getElementById("specColorDot").style.background = state.color;
      document.getElementById("ambientGlow").style.background = state.color;
    }

    // Generador SVG de Diseños Nail Art dentro de la máscara de la uña
    function getDesignMarkup() {
      if (state.design === "french") {
        // Sonrisa blanca impecable adaptada a la punta
        return `
          <path d="M -25,-75 L 25,-75 L 25,-34 C 14,-50 -14,-50 -25,-34 Z" fill="#FAF8F5" opacity="0.95" />
          <path d="M -23,-34 C -13,-49 13,-49 23,-34" stroke="#D4AF37" stroke-width="0.9" fill="none" opacity="0.6" />
        `;
      }
      if (state.design === "aura") {
        // Aura Glow difuminado en el corazón de la uña
        const auraColor = state.color === "#EAD8CE" || state.color === "#EFECE8" ? "#D47A87" : "#FFE3EC";
        return `
          <ellipse cx="0" cy="-22" rx="14" ry="24" fill="${auraColor}" opacity="0.65" filter="url(#softBlur)" />
        `;
      }
      if (state.design === "gold") {
        // Hojuelas orgánicas de Pan de Oro 24K
        return `
          <g fill="url(#gold18k)" opacity="0.92">
            <polygon points="-10,-48 -3,-54 2,-45 -6,-41" />
            <polygon points="5,-35 12,-40 14,-31 7,-28" />
            <polygon points="-12,-22 -6,-26 -4,-18 -11,-16" />
            <polygon points="2,-56 8,-60 10,-53 4,-51" />
            <circle cx="-3" cy="-32" r="1.8" />
            <circle cx="8" cy="-46" r="1.4" />
            <circle cx="-8" cy="-38" r="1.2" />
            <circle cx="4" cy="-19" r="1.5" />
          </g>
        `;
      }
      if (state.design === "cateye") {
        // Haz magnético diagonal de terciopelo
        return `
          <rect x="-26" y="-76" width="52" height="106" fill="url(#catEyeBeam)" />
        `;
      }
      if (state.design === "tortoise") {
        // Efecto Carey Ámbar / Tortoiseshell translúcido
        return `
          <rect x="-26" y="-76" width="52" height="106" fill="#B86B28" opacity="0.55" />
          <g fill="#261107" opacity="0.72" filter="url(#LunulaBlur)">
            <ellipse cx="-8" cy="-45" rx="8" ry="11" transform="rotate(-15 -8 -45)" />
            <ellipse cx="9" cy="-25" rx="9" ry="12" transform="rotate(20 9 -25)" />
            <ellipse cx="-5" cy="-8" rx="7" ry="9" />
            <ellipse cx="6" cy="-54" rx="6" ry="7" />
          </g>
          <g fill="#4A220E" opacity="0.5">
            <circle cx="2" cy="-36" r="6" />
            <circle cx="-11" cy="-24" r="5" />
          </g>
        `;
      }
      return "";
    }

    // Generador SVG de Brillo Top Coat y Reflejo de Estudio
    function getFinishMarkup() {
      if (state.finish === "matte") {
        // Acabado Velvet Mate (Satinado aterciopelado sin reflejo duro)
        return `
          <rect x="-26" y="-76" width="52" height="106" fill="#FFFFFF" opacity="0.06" />
          <path d="M -11,-50 C -13,-30 -13,-5 -10,12" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.12" filter="url(#LunulaBlur)" />
        `;
      }
      if (state.finish === "glazed") {
        // Glazed Cromo Perlado + Destello Espejo
        return `
          <rect x="-26" y="-76" width="52" height="106" fill="url(#glazedPearlSheen)" />
          <path d="M -11,-52 C -14,-30 -14,-4 -11,14" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.88" />
          <path d="M 13,-42 C 15,-24 15,-2 13,12" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.45" />
          <!-- Destello estelar cromo -->
          <path d="M -11,-42 L -11,-34 M -15,-38 L -7,-38" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
        `;
      }
      // Glossy Espejo (Brillo cristalino húmedo)
      return `
        <path d="M -11,-52 C -14,-30 -14,-4 -11,14" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.78" />
        <path d="M 13,-42 C 15,-24 15,-2 13,12" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.35" />
      `;
    }

    // Control del Acordeón (Click abre el bloque y empuja los demás abajo)
    function openAccordion(cardId) {
      const cards = document.querySelectorAll(".acc-card");
      const target = document.getElementById(cardId);
      const isOpen = target.classList.contains("open");

      cards.forEach(c => c.classList.remove("open"));
      if (!isOpen) {
        target.classList.add("open");
      }
    }

    // Cambiar Tono de Piel
    function setSkinTone(index, btn) {
      document.querySelectorAll(".skin-dot").forEach(d => d.classList.remove("active"));
      btn.classList.add("active");

      const p = SKIN_PALETTES[index];
      document.getElementById("skinStop1").setAttribute("stop-color", p.s1);
      document.getElementById("skinStop2").setAttribute("stop-color", p.s2);
      document.getElementById("skinStop3").setAttribute("stop-color", p.s3);
      document.getElementById("skinStop4").setAttribute("stop-color", p.s4);
      document.getElementById("skinStop5").setAttribute("stop-color", p.s5);
      document.getElementById("blushStop1").setAttribute("stop-color", p.blush);
      document.getElementById("blushStop2").setAttribute("stop-color", p.blush);
      currentCreaseColor = p.crease;

      buildHandScene();
    }

    // Eventos de Paleta de Tonos
    document.querySelectorAll(".color-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.color = btn.getAttribute("data-color");
        state.colorName = btn.getAttribute("data-name");
        buildHandScene();
      });
    });

    // Cambiar Forma Estructural
    function setNailShape(shapeKey, shapeLabel, btn) {
      btn.parentElement.querySelectorAll(".opt-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.shape = shapeKey;
      state.shapeName = shapeLabel;
      buildHandScene();
    }

    // Cambiar Acabado Final
    function setNailFinish(finishKey, finishLabel, btn) {
      btn.parentElement.querySelectorAll(".opt-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.finish = finishKey;
      state.finishName = finishLabel;
      buildHandScene();
    }

    // Cambiar Diseño Armado
    function setNailDesign(designKey, designLabel, btn) {
      btn.parentElement.querySelectorAll(".design-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.design = designKey;
      state.designName = designLabel;
      buildHandScene();
    }

    // Enviar selección a la agenda de Samm Nail Studio
    function triggerParentBooking() {
      try {
        window.parent.postMessage({
          type: "SAMM_BOOKING_PRESET",
          color: state.colorName,
          shape: state.shapeName,
          finish: state.finishName,
          design: state.designName
        }, "*");
      } catch (err) {
        console.error(err);
      }
    }

    // Inicializar escena
    buildHandScene();
  </script>
</body>
</html>
