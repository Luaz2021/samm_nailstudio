                                <path d="M-28,28 C-18,10 -10,-12 -2,-24 C2,-30 8,-28 8,-20 C8,-8 -2,12 -8,28" fill="none" stroke="#231C1A" stroke-width="2" stroke-linecap="round" class="logo-adaptive-stroke"/>
                                <!-- Uña almendrada pintada en el extremo del dedo -->
                                <path d="M-2,-24 C1,-35 9,-37 10,-26 C9,-21 3,-20 -2,-24 Z" fill="#C8927B"/>
